<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Print Shop</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-100 via-white to-purple-100 flex items-center justify-center p-6">

    <div class="w-full max-w-5xl bg-white rounded-3xl shadow-2xl overflow-hidden grid lg:grid-cols-2">

        <!-- Left Side -->
        <div class="hidden lg:flex flex-col justify-center bg-gradient-to-br from-blue-600 via-indigo-600 to-purple-600 text-white p-12">

            <h1 class="text-5xl font-bold leading-tight">
                Welcome Back!
            </h1>

            <p class="mt-6 text-blue-100 text-lg leading-8">
                Login to upload your print files, track orders,
                manage previous prints, and enjoy a faster printing experience.
            </p>

            <div class="mt-10">
                <i class="fa-solid fa-print text-8xl opacity-20"></i>
            </div>

        </div>

        <!-- Right Side -->
        <div class="p-10 lg:p-14">

            <div class="text-center">

                <div class="w-16 h-16 mx-auto rounded-2xl bg-blue-600 flex items-center justify-center text-white text-2xl">
                    <i class="fa-solid fa-print"></i>
                </div>

                <h2 class="mt-6 text-3xl font-bold text-gray-800">
                    Login
                </h2>

                <p class="text-gray-500 mt-2">
                    Sign in to continue
                </p>

            </div>

            <form class="mt-10 space-y-6">

                <!-- Email -->
                <div>

                    <label class="block text-gray-700 font-medium mb-2">
                        Email Address
                    </label>

                    <div class="relative">

                        <i class="fa-solid fa-envelope absolute left-4 top-4 text-gray-400"></i>

                        <input
                            type="email"
                            placeholder="Enter your email"
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">

                    </div>

                </div>

                <!-- Password -->
                <div>

                    <label class="block text-gray-700 font-medium mb-2">
                        Password
                    </label>

                    <div class="relative">

                        <i class="fa-solid fa-lock absolute left-4 top-4 text-gray-400"></i>

                        <input
                            type="password"
                            placeholder="Enter your password"
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">

                    </div>

                </div>

                <!-- Options -->
                <div class="flex items-center justify-between">

                    <label class="flex items-center gap-2 text-sm text-gray-600">

                        <input type="checkbox" class="accent-blue-600">

                        Remember Me

                    </label>

                    <a href="#" class="text-blue-600 hover:text-blue-800 text-sm font-medium">
                        Forgot Password?
                    </a>

                </div>

                <!-- Login Button -->
                <button
                    type="button"
                    onclick="window.location.href='dashboard.html'"
                    class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold transition duration-300">

                    Login

                </button>

            </form>

            <!-- Divider -->
            <div class="flex items-center my-8">

                <div class="flex-1 h-px bg-gray-300"></div>

                <span class="px-4 text-gray-500 text-sm">
                    OR
                </span>

                <div class="flex-1 h-px bg-gray-300"></div>

            </div>

            <!-- Sign Up -->
            <p class="text-center text-gray-600">

                Don't have an account?

                <a href="register.html" class="text-blue-600 font-semibold hover:underline">
                    Create Account
                </a>

            </p>

        </div>

    </div>

</body>
</html>
